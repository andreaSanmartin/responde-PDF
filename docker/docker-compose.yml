# docker-compose.yml para el USUARIO FINAL.
# No construye nada: descarga la imagen ya publicada y la ejecuta.
# Uso: copia este archivo a tu servidor y ejecuta `docker compose up -d`.

services:
  respondepdf-backend:
    image: respondepdf/backend:latest   # ← descarga la imagen ya construida
    container_name: respondepdf-backend
    ports:
      - "3000:3000"
    environment:
      - GEMINI_MODEL=gemini-2.0-flash
      - PORT=3000
      - RATE_LIMIT_PER_MIN=30
      # Opcionales:
      # - GEMINI_API_BASE=https://generativelanguage.googleapis.com/v1beta
      # - MAX_CONTEXT_CHARS=800000
      # - BODY_LIMIT=25mb
      # - CORS_ORIGINS=*
      # - TRUST_PROXY=1        # si hay un proxy inverso (Nginx, Traefik...) delante
    restart: unless-stopped
